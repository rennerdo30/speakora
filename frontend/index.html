<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speakora — Speech-to-Speech Translation Dashboard</title>
    <meta
      name="description"
      content="Queue, monitor and manage SeamlessM4T v2 speech-to-speech translation jobs."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Apply the saved (or system) theme before first paint so the page never
       * flashes the wrong palette. Keep the key and attribute in sync with
       * src/composables/useTheme.ts.
       */
      ;(function () {
        var STORAGE_KEY = 'speakora:theme'
        var stored = null
        try {
          stored = localStorage.getItem(STORAGE_KEY)
        } catch (error) {
          /* storage unavailable — fall back to the system preference */
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Speakora needs JavaScript to run. Please enable it and reload this page.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
